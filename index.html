<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanji Memory</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d1d1f;--muted:#76736b;--line:#e1ddd2;--accent:#c0392b;
--forgot:#fa3b33;--easy:#6bb352;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#232328;--text:#f0eee8;--muted:#9a978f;--line:#34343a;--accent:#e8685a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--card:#232328;--text:#f0eee8;--muted:#9a978f;--line:#34343a;--accent:#e8685a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}
#mascot{width:120px;height:120px;margin:-16px;flex:none;cursor:pointer;touch-action:manipulation}
.stats{display:flex;flex-direction:column;gap:5px;flex:1}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--easy);transition:width .4s,background .4s}
.kanji{text-align:center;font-size:84px;font-weight:600;line-height:1.2;padding:10px 0 4px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.flip{width:100%;min-height:110px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;color:var(--text);
font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;transition:border-color .15s}
.flip:active{transform:scale(.99)}
.flip .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.flip .hint{font-size:16px;color:var(--muted)}
.flip .ans{font-size:28px;font-weight:600}
.flip.meaning .ans{font-size:22px}
.flip.open{border-color:#ffcd1e}
.ch{position:relative;display:inline-block}
.forgot .ch::after{content:attr(data-c);position:absolute;left:0;top:0}
.forgot .ch::after{color:var(--forgot);clip-path:inset(var(--r))}.forgot .ch::before{content:attr(data-c);position:absolute;left:0;top:0;color:var(--forgot);clip-path:inset(var(--r2,0 100% 0 0))}
.ex{white-space:pre-line;text-align:center;font-size:14px;color:var(--muted);line-height:1.5}
.flip.meaning .ans{text-align:center}
.rate{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;min-height:54px}
.rate button{border:0;border-radius:12px;padding:15px 0;font:inherit;font-weight:600;font-size:16px;color:#fff;cursor:pointer}
.rate button:active{transform:scale(.97)}
.f{background:var(--forgot)}.e{background:var(--easy)}
.rate[hidden]{display:none}
.wait{color:var(--muted);text-align:center;font-size:14px;align-self:center}
.foot{text-align:center;font-size:12px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer}
.kanji.quiz{font-size:60px!important;padding:0!important}
.qk{font-size:40px;font-weight:600;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.qa{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.qa .qk{font-size:30px}.qr{font-size:20px;font-weight:600}.qm{font-size:16px}.qb{font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:600px){
 body{display:block}
 main{max-width:none;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:14px 16px 16px;gap:12px}
 .kanji{font-size:clamp(96px,30vw,150px);padding:6px 0}
 .flip{flex:1 1 0;min-height:96px;border-radius:20px}
 .flip .ans{font-size:36px}.flip.meaning .ans{font-size:30px}
 .flip .hint{font-size:18px}.ex{font-size:16px}
 .rate{min-height:64px}.rate button{font-size:18px;padding:20px 0;border-radius:16px}
 .wait{min-height:64px;display:flex;align-items:center}
}
/* fixed sizes: nothing resizes when cards flip or the buttons appear */
.kanji{height:116px;display:flex;align-items:center;justify-content:center;padding:0!important}
.flip{height:170px;min-height:0;overflow:hidden}
.rate{height:56px;min-height:0}.rate button{height:100%;padding:0}
.wait{height:56px;display:flex;align-items:center;justify-content:center}
.wait[hidden]{display:none}
@media (max-width:600px){
 .kanji{height:clamp(120px,38vw,190px)}
 .flip{height:auto;flex:1 1 0;min-height:0;padding:10px}
 .rate,.wait{height:68px;min-height:0}.rate button{padding:0}
 .qa .qk{font-size:24px}.qr{font-size:17px}.qm{font-size:14px}.qb{font-size:11px}.qa{gap:1px}
 .flip.meaning .ans{font-size:26px}.ex{font-size:14px}
}
.kanji{height:136px;padding-top:14px!important}
.fg{position:absolute;left:50%;transform:translateX(-50%);top:-.6em;font-size:.2em;line-height:1;z-index:2;text-shadow:0 0 5px var(--bg);font-weight:500;color:var(--text);opacity:.85;white-space:nowrap;font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
@media (max-width:600px){.kanji{height:clamp(150px,50vw,240px);padding-top:clamp(14px,5vw,30px)!important}}
.flip.right{background:#e4f1e0;border-color:#6bb352}
.flip.wrong{background:#fee6e5;border-color:#fa3b33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flip.right{background:#2f4130}:root:not([data-theme="light"]) .flip.wrong{background:#4e282a}}
.flip.meaning.open:not(.right):not(.wrong){background:#fff6d6;border-color:#ffd93a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flip.meaning.open:not(.right):not(.wrong){background:#4f4526}}
.flip .label{display:none}
.flip .ans{font-size:44px}.flip.meaning .ans{font-size:34px}.flip .hint{font-size:20px}.ex{font-size:15px}
.qa .qk{font-size:32px}.qr{font-size:24px}.qm{font-size:20px}.qb{font-size:13px}
@media (max-width:600px){
 .flip .ans{font-size:44px}.flip.meaning .ans{font-size:34px}.ex{font-size:13px;line-height:1.4}
 .qa .qk{font-size:26px}.qr{font-size:20px}.qm{font-size:16px}.qb{font-size:11px}
}
.hd{color:#3875f2}
.tw{position:relative;cursor:pointer;border-bottom:1.5px dotted var(--muted)}.tip{position:absolute;left:0;top:100%;margin-top:6px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;font-size:15px;font-weight:500;white-space:nowrap;z-index:5;font-family:-apple-system,"Hiragino Sans",system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.kw{display:inline-flex;flex-direction:column;align-items:center}.kwi{display:inline-block;line-height:1.2}.cue{width:0;min-width:100%;white-space:normal;text-align:center;font-size:13px;font-weight:400;line-height:1;margin-bottom:2px;color:var(--muted);font-family:system-ui,sans-serif;cursor:pointer}.redp{color:var(--forgot)}
.qk.mo{font-size:28px;font-family:inherit;text-align:center}
.kanji{position:relative}.kb{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:13px;font-weight:400;color:var(--muted);font-family:system-ui,sans-serif;line-height:1}
.kanji.duel{font-size:21px!important;flex-direction:column;gap:6px;line-height:1.35}.kanji.duel small{font-size:13px;color:var(--muted);font-weight:400}
:root{--deep:#3875f2}
.kanji.deep{color:var(--deep)}
.kanji.sent{font-size:28px!important;line-height:1.5;font-weight:500;padding:0 14px!important}
.kanji.sent b{font-weight:700;text-decoration:underline;text-underline-offset:7px}
.wd{position:relative;display:inline-block}
.flip.off{display:none}
.dlf{display:flex;flex-direction:column;justify-content:center;gap:10px}
.dlf[hidden]{display:none}
.dlf input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);font:inherit;font-size:24px;text-align:center;padding:0 12px;outline:none}
.dlf input::placeholder{font-size:16px;color:var(--muted)}
.dlf input:focus{border-color:var(--deep)}
.dlgo{height:56px;border:0;border-radius:14px;background:var(--deep);color:#fff;font:inherit;font-weight:600;font-size:18px;cursor:pointer}
.dlgo:active{transform:scale(.98)}
.dlskip{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;align-self:center}
@media (min-width:601px){.dlf{min-height:350px}}
.tray{min-height:60px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:6px 4px;border-bottom:2px dashed var(--line)}
.tray .ph{color:var(--muted);font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-width:52px;height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:24px;cursor:pointer;touch-action:manipulation}
.chip:active{transform:scale(.96)}
.tray .chip{border-color:var(--deep)}
.chip.gone{visibility:hidden}
.mc{display:flex;flex-direction:column;gap:8px}
.mcb{width:100%;font-size:20px}
.mcb.sel{border-color:var(--deep);box-shadow:0 0 0 1px var(--deep)}
@media (max-width:600px){.dlf{flex:1 1 0;min-height:0}}
</style>
</head>
<body>
<main>
  <div class="top"><canvas id="mascot" role="button" aria-label="Study buddy, tap to say hello"></canvas><div class="stats"><span id="count">Reviewed: 0</span><span id="tally"></span><div class="bar"><i id="barFill"></i></div><span id="mastered"></span></div></div>
  <div class="kanji" id="kanji"></div>
  <button class="flip" id="readingCard"><span class="label">Pronunciation</span><span class="hint" id="readingText">Tap to reveal</span></button>
  <button class="flip meaning" id="meaningCard"><span class="label">Meaning</span><span class="hint" id="meaningText">Tap to reveal</span><span class="ex" id="exText"></span></button>
  <div class="dlf" id="dlForm" hidden>
    <div class="tray" id="dlTray" aria-label="Your answer"></div>
    <div class="bank" id="dlBank"></div>
    <div class="mc" id="dlM" aria-label="Pick the meaning"></div>
    <button class="dlgo" id="dlGo">Check</button>
    <button class="dlskip" id="dlSkip">Skip this one</button>
  </div>
  <div class="wait" id="wait">Flip both cards to continue</div>
  <div class="rate" id="rate" hidden>
    <button class="f" data-r="forgot">Forgot</button>
    <button class="e" data-r="easy">Easy</button>
  </div>
  <div class="foot">Hard words come back more often. <button id="reset">Reset progress</button> · <button id="mute">Sound on</button> · <button id="t20">Test: first 20 known</button></div>
</main>
<script>
// =====================================================================================
// HOW THE KANJI HINT SYSTEM WORKS  (read this first when adding words in a new chat)
// =====================================================================================
// 1) PER-WORD DATA. To add a word, append ONE entry to EACH of these (same index = same word; check
//    that every length equals WORDS.length afterwards; new words go at the END, N0 words are the
//    initial set and the rest unlock one by one):
//      WORDS[i]   {k:"two kanji", r:"hiragana reading", m:"short English meaning", ex:"Japanese sentence\nEnglish"}
//      HL[i]      [red part of 1st kanji, red part of 2nd kanji]            (see 2)
//      HK[i]      the hint line                                             (see 3 and 4)
//      SENT[i]    cloze sentence: tokens separated by spaces; kanji tokens "kanji|reading|gloss" (gloss may use _),
//                 the target word is written "*word" with no reading, kana/particles plain, "。" is its own token
//      WRONGS[i]  4 plausible WRONG spellings of the reading (typos, missing/extra kana, long-vowel mistakes)
//      HINT[i]    [1, reading chunk of the 2nd kanji incl. dakuten, e.g. [1,"ぴょう"]]
//      DECOY[i]   a look-alike distractor word: an index of an existing word or {k:"..",r:"..",m:".."}; its
//                 reading must differ from the target's
//      ALT        object keyed by the kanji word: extra accepted English answers (synonyms, inflections)
//      MCWRONG    object keyed by the kanji word: 2 wrong multiple-choice meanings that look like the right one
//    CONF (confusable words) is computed automatically. Pick N2-level, common JLPT words made of two
//    kanji; avoid a meaning that duplicates an existing word's m or ALT (e.g. "effect" belongs to 影響).
//    Verify by running the script through node --check, counting the arrays, and rendering HL (see 2).
//
// 2) RED PARTS (HL). A red word (level < 0, class "forgot") shows ONE recognisable part of EACH
//    of its two kanji in red, so the eye learns both kanji. Rules: exactly one part per kanji,
//    it must look like the thing the hint talks about (hand, water, knife, roof, sun...).
//    Format "T R B L" = inset % of the character box, clip-path inset(T R B L) on a red copy
//    of the character (.forgot .ch::after).  "0 100 0 0" = nothing red, "0 0 0 0" = whole kanji.
//    The box is 1em wide and 1.2em tall (line-height 1.2) with the glyph centred, so the glyph
//    spans about 8%..92% of the box height: top/bottom insets must be converted
//    (box% = 8.33 + 0.8333 * glyph%), left/right need no conversion.
//    Typical values: left radical (hand/water/person) "0 65 0 0"; right part "0 0 0 50";
//    top part "0 0 55 0"; bottom part "54 0 0 0".  An optional second rectangle "a|b" is supported
//    (--r2 on .forgot .ch::before) but the rule is ONE part per kanji, so do not use it.
//    ALWAYS check by rendering (Python PIL with Noto Serif CJK JP, box 104x125, glyph centred
//    anchor "mm", paste the red crop) and look at the picture before delivering.
//
// 3) THE HINT LINE (HK). paintCue() puts it as a small grey line (13px, no box, no border) directly
//    above the word, as wide as the two kanji (.kw wrapper > .cue + .kwi). Only shown for red words.
//    Tapping it lets the user write their own hook (localStorage "kanjiMemoryHooks.v1", keyed by the
//    kanji word, overrides HK).  Keep it to ONE short sentence (about 60 characters max).
//
// 4) HINT RULES (the user's rules, he gets very angry when they are broken):
//    - Tell a small, simple, believable STORY that uses the two RED parts (name them: knife, hand,
//      water, roof...) and leads naturally to the meaning WITHOUT stating the English meaning or an
//      obvious synonym ("decide", "resist", "improve"...).
//    - Include a SOUND-ALIKE HOOK for the hiragana reading, written in CAPITALS inside the story
//      (e.g. かくとく = "A CAT TOOK it with a quick hand"; ていあん = "TAY holds out a branch to ANN";
//      ちゅうもく = "...the kid CHEWING MOCHI"). Natural names/words only; if no natural hook exists,
//      pick the closest plain-English one, never a nonsense phrase.
//    - Must be easy to remember and easy to understand: no riddles, no rare words, no cryptic
//      logic ("tangle", "paw prints" were rejected), no scenes that make the reader ask "why?".
//    - The story must match what the red parts actually LOOK like. If the part does not look like
//      the thing in the story, change the story or the red part.
//    - Never cut open / measure / lay out things without a clear reason that leads to the meaning.
//    Process per word: (a) read the reading and meaning, (b) pick the most visible part in each kanji
//    and name what it looks like, (c) write the story linking both images to the meaning,
//    (d) weave in the sound-alike hook, (e) render the red parts and re-read the sentence as a
//    stranger: does it make sense without being told the answer?
//
// 5) DESIGN RULE: do not invent design changes (colours, backgrounds, layout) that were not asked for;
//    change only what the user asked and keep everything else as it was.
// 6) LEARNING FLOW (user's rules, keep them when changing the app):
//    Stages per word (marks[k] -> st(k)): -2 red + help (hook line), -1 red without help, 0 black,
//    1 hiragana mode, 2 spelling mode. Easy = one stage up, Forgot = one stage down (red stays at -2).
//    - Only ACTIVE (4) words are learned at the same time (working memory holds about 4 chunks, Cowan 2001).
//      act[] is that set. A new word comes in ONLY when a word passes spelling mode (Easy at stage 2) and leaves
//      act. New words are taken in list order but skip ones that look/sound like a word already in act (fillActive()).
//    - A finished word is not shown for a long while: it only comes back as a blue deep learning card
//      (at most one every DLGAP = 30 cards; due 30 / 90 / 200 / 400 cards after the last time).
//      Forgot in deep learning: back to spelling mode and into act again.
//    - Difficult words come more often (diff[k]); words pressed Easy again and again come less (easies[k]).
//    - Words may contain kana (済んでいる) or be one kanji (腹): HL then needs one entry per character, "0 100 0 0" for kana.
//
// =====================================================================================
const WORDS = [
  {k:"判断", r:"はんだん", m:"decide", ex:"状況を見て判断する。\nI'll decide after seeing the situation."},
  {k:"状況", r:"じょうきょう", m:"situation", ex:"今の状況を教えてください。\nPlease tell me how things stand now."},
  {k:"経験", r:"けいけん", m:"experience", ex:"日本で働いた経験がある。\nI have experience working in Japan."},
  {k:"解決", r:"かいけつ", m:"solve", ex:"問題が解決した。\nThe problem got solved."},
  {k:"影響", r:"えいきょう", m:"influence", ex:"天気の影響で電車が遅れた。\nThe train was late because of the weather."},
  {k:"確認", r:"かくにん", m:"check", ex:"予定を確認します。\nI'll check the schedule."},
  {k:"適切", r:"てきせつ", m:"appropriate", ex:"適切な対応をお願いします。\nPlease respond appropriately."},
  {k:"維持", r:"いじ", m:"maintain", ex:"健康を維持する。\nTo maintain one's health."},
  {k:"防止", r:"ぼうし", m:"prevent", ex:"事故を防止する。\nTo prevent accidents."},
  {k:"再生", r:"さいせい", m:"play (a video)", ex:"動画を再生する。/ 再生回数が多い。\nPlay the video. / It has lots of views."},
  {k:"苗字", r:"みょうじ", m:"surname", ex:"苗字は田中です。\nMy surname is Tanaka."},
  /* N2 words, unlocked one at a time (see unlockNext) */
  {k:"改善", r:"かいぜん", m:"improve", ex:"サービスを改善する。\nTo improve the service."},
  {k:"比較", r:"ひかく", m:"compare", ex:"二つの商品を比較する。\nTo compare two products."},
  {k:"増加", r:"ぞうか", m:"increase", ex:"人口が増加している。\nThe population is increasing."},
  {k:"提案", r:"ていあん", m:"propose", ex:"新しい方法を提案する。\nI propose a new method."},
  {k:"評価", r:"ひょうか", m:"evaluate", ex:"先生に高く評価された。\nI was rated highly by the teacher."},
  {k:"注目", r:"ちゅうもく", m:"attention", ex:"その発表は注目を集めた。\nThat presentation drew attention."},
  {k:"傾向", r:"けいこう", m:"tendency", ex:"最近、本を読まない傾向がある。\nThere's a tendency lately not to read books."},
  {k:"実現", r:"じつげん", m:"realize", ex:"夢が実現した。\nThe dream came true."},
  {k:"検討", r:"けんとう", m:"consider", ex:"計画を検討する。\nTo consider the plan."},
  {k:"対象", r:"たいしょう", m:"target", ex:"調査の対象は学生です。\nThe subjects of the survey are students."},
  {k:"解釈", r:"かいしゃく", m:"interpret", ex:"この文は二通りに解釈できる。\nThis sentence can be interpreted in two ways."},
  {k:"把握", r:"はあく", m:"grasp", ex:"状況を正確に把握する。\nTo grasp the situation accurately."},
  {k:"貢献", r:"こうけん", m:"contribute", ex:"チームの勝利に貢献した。\nI contributed to the team's victory."},
  {k:"負担", r:"ふたん", m:"burden", ex:"費用の負担が大きい。\nThe cost burden is heavy."},
  {k:"普及", r:"ふきゅう", m:"spread", ex:"スマホが急速に普及した。\nSmartphones spread rapidly."},
  {k:"獲得", r:"かくとく", m:"acquire", ex:"新しい顧客を獲得する。\nTo acquire new customers."},
  {k:"需要", r:"じゅよう", m:"demand", ex:"夏は冷たい飲み物の需要が増える。\nDemand for cold drinks rises in summer."},
  {k:"抵抗", r:"ていこう", m:"resist", ex:"変化に抵抗する人もいる。\nSome people resist change."},
  {k:"依存", r:"いぞん", m:"depend", ex:"スマホに依存しすぎている。\nI'm too dependent on my phone."},
  {k:"管理", r:"かんり", m:"manage", ex:"データを安全に管理する。\nTo manage data securely."},
  {k:"条件", r:"じょうけん", m:"condition", ex:"条件に合う人を探している。\nI'm looking for someone who meets the conditions."},
  {k:"記録", r:"きろく", m:"record", ex:"毎日の勉強時間を記録している。\nI record my study time every day."},
  {k:"資料", r:"しりょう", m:"materials", ex:"会議の資料を準備する。\nI prepare the materials for the meeting."},
  {k:"招待", r:"しょうたい", m:"invite", ex:"友達を誕生日パーティーに招待した。\nI invited my friends to the birthday party."},
  {k:"調査", r:"ちょうさ", m:"investigate", ex:"事故の原因を調査している。\nThey are investigating the cause of the accident."},
  {k:"発表", r:"はっぴょう", m:"announce", ex:"研究の結果を発表する。\nI present the results of my research."},
  {k:"習慣", r:"しゅうかん", m:"habit", ex:"早起きの習慣をつけたい。\nI want to get into the habit of waking up early."},
  {k:"交換", r:"こうかん", m:"exchange", ex:"古いスマホを新しいものと交換した。\nI exchanged my old phone for a new one."},

/* frog voice: a deep, slow Japanese voice that speaks the reading one syllable at a time, so the frog's mouth knows exactly which
   syllable is playing (the browser tells us when each one starts/ends). Syllables are cut from the kana automatically, so any new word
   works with no extra data. Male Japanese voice if the device has one. Follows the Sound on/off button. */
try{speechSynthesis.getVoices()}catch(e){}
const SH={a:[1,.85],i:[.45,1],u:[.6,.45],e:[.7,.85],o:[.9,.55]},ROWS={a:'あかさたなはまやらわがざだばぱぁ',i:'いきしちにひみりぎじぢびぴ',u:'うくすつぬふむゆるぐずづぶぷぅ',e:'えけせてねへめれげぜでべぺ',o:'おこそとのほもよろをごぞどぼぽ'};
const kata=t=>t.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
/* kana -> syllables {v: vowel, t: text to say}; small ゃゅょ, ん, long vowels and ー join the syllable before, っ joins the next one */
function kanaUnits(r){const us=[];let pre='';[...r].forEach(c=>{const pv=us[us.length-1];
 if('ゃゅょ'.includes(c)&&pv){pv.v=c==='ゃ'?'a':c==='ゅ'?'u':'o';pv.t+=c;return}
 if(c==='ー'&&pv){pv.t+=c;return}
 if(c==='っ'){pre+=c;return}
 if(c==='ん'){if(pv)pv.t+=c;else pre+=c;return}
 let v=null;for(const k in ROWS)if(ROWS[k].includes(c))v=k;if(!v)return;
 if(pv&&((c==='う'&&(pv.v==='o'||pv.v==='u'))||(c==='い'&&pv.v==='e')||(c==='お'&&pv.v==='o'))){pv.t+=c;return}
 us.push({v,t:pre+c});pre=''});return us}
function lipAt(T){const L=M.lip;if(!L)return{o:.4,w:.7};
 if(L.fb)return{o:.75*Math.abs(Math.sin(T*6)),w:.7};
 const sh=L.on&&L.cur>=0?L.u[L.cur]:null;L.mo+=((sh?sh.s:0)-L.mo)*.55;if(sh)L.mw=sh.w;return{o:L.mo,w:L.mw}}
function speak(t){if(muted||!window.speechSynthesis)return;try{speechSynthesis.cancel();const id=M.tid=(M.tid||0)+1;
 const FEM=/female|kyoko|o-ren|haruka|ayumi|sayaka|nanami|mizuki|sakura|google 日本語/i,ROB=/zarvox|fred|trinoids|ralph|junior|albert|bad news|bubbles|cellos|whisper|organ|boing|bells|hysterical/i,MAN=/otoya|ichiro|hattori|takumi|keita|ken\b|男/i;
 const vs=speechSynthesis.getVoices().filter(x=>(x.lang||'').replace('_','-').toLowerCase().startsWith('ja')&&!ROB.test(x.name)),
 mv=vs.find(x=>!FEM.test(x.name)&&MAN.test(x.name))||vs.find(x=>!FEM.test(x.name)),v=mv||vs[0];
 let us=kanaUnits(t);if(!us.length)us=[{v:'a',t}];
 const L=M.lip={u:us.map(x=>({s:SH[x.v][0],w:SH[x.v][1]})),cur:-1,on:false,mo:0,mw:.7,fb:false};M.talking=true;
 us.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(kata(x.t));u.lang='ja-JP';if(v)u.voice=v;u.pitch=.1;u.rate=.6;u.volume=1;
  u.onstart=()=>{if(M.tid===id){L.cur=i;L.on=true;L.fb=false}};
  u.onend=()=>{if(M.tid!==id)return;L.on=false;if(i===us.length-1)setTimeout(()=>{if(M.tid===id)M.talking=false},200)};
  u.onerror=()=>{if(M.tid===id&&i===us.length-1)M.talking=false};
  speechSynthesis.speak(u)});
 setTimeout(()=>{if(M.tid===id&&L.cur<0)L.fb=true},800); /* engine sent no events: plain flapping instead */
 setTimeout(()=>{if(M.tid===id)M.talking=false},4000+t.length*3000)}catch(e){}}
$('mute').textContent=muted?'Sound off':'Sound on';
$('mute').onclick=()=>{muted=!muted;try{localStorage.setItem('kanjiMute',muted?'1':'0')}catch(e){}$('mute').textContent=muted?'Sound off':'Sound on'};
/* behaviour */
let streak=0;
function onRated(r){M.L=Math.max(0,Math.min(10,M.L+(r==='easy'?1:-1)));try{localStorage.setItem('kanjiFrogLevel',M.L)}catch(e){}if(r==='easy'){streak++;if(streak%3===0){react('milestone');snd('celebrate')}else{react('easy');snd('good')}}else{streak=0;react('forgot');snd('complain')}}
function refreshProgress(){
 const p=weights.reduce((s,w)=>s+Math.max(0,Math.min(1,(3-w)/2.5)),0)/WORDS.length,n=weights.filter(w=>w<1).length;
 M.progress=p;M.approaching=revR&&revM;$('barFill').style.width=(M.L*10)+'%';$('barFill').style.background=lvlColor(M.L/10);$('mastered').textContent='Frog health '+M.L+'/10';if(REDUCED)draw()}
cv.onclick=()=>{const n=now();M.pokes=n-M.lastPoke<.8?M.pokes+1:1;M.lastPoke=n;M.shapeIdx=M.shapeIdx%7+1;react('poke');snd(M.pokes>=3?'complain':['hello','squeak','chirp'][M.shapeIdx%3])};
addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),c=v=>Math.max(-1,Math.min(1,v));M.look=[c((e.clientX-r.left-r.width/2)/120),c(-(e.clientY-r.top-r.height/2)/120)];M.lookUntil=now()+2.5});

show();
</script>
</body>
